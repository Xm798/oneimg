name: Build

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ghcr-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  preflight:
    name: Preflight
    # workflow_dispatch skips this job, and therefore publish: a manual run is a CI dry run.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      publish: ${{ steps.decide.outputs.publish }}
      publish_latest: ${{ steps.decide.outputs.publish_latest }}
      publish_minor: ${{ steps.decide.outputs.publish_minor }}
      publish_major: ${{ steps.decide.outputs.publish_major }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Decide what to publish
        id: decide
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          publish=false latest=false minor=false major=false
          stable='^v[0-9]+\.[0-9]+\.[0-9]+$'
          # Reads tags at run time, so re-running an old tag after a newer release leaves the aliases alone.
          # Only default-branch tags count: a tag elsewhere is refused below and must not hold back latest.
          highest() { git tag -l --merged "origin/${DEFAULT_BRANCH}" "$1" | { grep -E "$stable" || true; } | sort -V | tail -n 1; }
          is_highest() { if [[ "$(highest "$1")" == "$GITHUB_REF_NAME" ]]; then echo true; else echo false; fi; }

          if [[ "$GITHUB_REF_TYPE" == branch ]]; then
            # Both main and master trigger CI so the workflow fits upstream and the fork; only the default branch publishes.
            if [[ "$GITHUB_REF_NAME" == "$DEFAULT_BRANCH" ]]; then publish=true; fi
          else
            if ! [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "::error::${GITHUB_REF_NAME} is not vX.Y.Z or vX.Y.Z-<pre>; refusing to publish"
              exit 1
            fi
            if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/${DEFAULT_BRANCH}"; then
              echo "::error::${GITHUB_REF_NAME} (${GITHUB_SHA}) is not reachable from origin/${DEFAULT_BRANCH}; refusing to publish"
              exit 1
            fi
            publish=true
            if [[ "$GITHUB_REF_NAME" =~ $stable ]]; then
              latest="$(is_highest 'v*')"
              minor="$(is_highest "${GITHUB_REF_NAME%.*}.*")"
              major="$(is_highest "${GITHUB_REF_NAME%%.*}.*")"
            fi
          fi

          {
            echo "publish=${publish}"
            echo "publish_latest=${latest}"
            echo "publish_minor=${minor}"
            echo "publish_major=${major}"
          } >> "$GITHUB_OUTPUT"
          echo "ref=${GITHUB_REF_NAME} publish=${publish} latest=${latest} minor=${minor} major=${major}"

  security:
    name: Security
    # A called workflow cannot exceed the permissions granted to the calling job.
    permissions:
      contents: read
    uses: ./.github/workflows/security-regression.yaml

  build:
    name: Build ${{ matrix.platform }}
    needs: [preflight, security]
    if: needs.preflight.outputs.publish == 'true'
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          # Native arm64 runner: compiling CGO and libwebp under QEMU dominated the single-runner build.
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The repository part is fixed so a renamed fork still publishes to <owner>/oneimg.
      - name: Image name
        id: image
        shell: bash
        run: |
          echo "name=${REGISTRY}/${GITHUB_REPOSITORY_OWNER,,}/oneimg" >> "$GITHUB_OUTPUT"
          echo "pair=${PLATFORM//\//-}" >> "$GITHUB_OUTPUT"
        env:
          PLATFORM: ${{ matrix.platform }}

      # Only the labels are used here; the merge job owns the tags.
      - name: Image labels
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.image.outputs.name }}

      - name: Build and push by digest
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.metadata.outputs.labels }}
          outputs: type=image,name=${{ steps.image.outputs.name }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ steps.image.outputs.pair }}
          cache-to: type=gha,scope=${{ steps.image.outputs.pair }},mode=max
          provenance: true
          sbom: true

      - name: Export digest
        shell: bash
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ steps.image.outputs.pair }}
          path: ${{ runner.temp }}/digests/*
          retention-days: 1
          if-no-files-found: error

  publish:
    name: Publish multi-arch image
    needs: [preflight, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digests-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # attest-build-provenance does not lowercase subject-name, so one lowercased value feeds both steps.
      - name: Image name
        id: image
        shell: bash
        run: echo "name=${REGISTRY}/${GITHUB_REPOSITORY_OWNER,,}/oneimg" >> "$GITHUB_OUTPUT"

      - name: Image tags
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.image.outputs.name }}
          # latest=auto would add latest for every tag entry below; preflight owns that decision.
          flavor: |
            latest=false
          tags: |
            type=raw,value=edge,enable=${{ github.ref_type == 'branch' }}
            type=sha,prefix=sha-,format=short,enable=${{ github.ref_type == 'branch' }}
            type=ref,event=tag
            type=semver,pattern=v{{major}}.{{minor}},enable=${{ needs.preflight.outputs.publish_minor == 'true' }}
            type=semver,pattern=v{{major}},enable=${{ needs.preflight.outputs.publish_major == 'true' }}
            type=raw,value=latest,enable=${{ needs.preflight.outputs.publish_latest == 'true' }}

      - name: Create manifest list and push
        id: manifest
        shell: bash
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          FIRST_TAG: ${{ fromJSON(steps.metadata.outputs.json).tags[0] }}
        run: |
          mapfile -t tags < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          args=()
          for tag in "${tags[@]}"; do args+=(-t "$tag"); done
          sources=()
          for digest in *; do sources+=("${IMAGE}@sha256:${digest}"); done
          docker buildx imagetools create "${args[@]}" "${sources[@]}"
          digest="$(docker buildx imagetools inspect "$FIRST_TAG" --format '{{json .Manifest}}' | jq -r .digest)"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true
          # Storage records need artifact-metadata: write and work only for organization-owned repositories.
          create-storage-record: false
